[package]
name = "echo_cli"
version = "0.1.0"
edition = "2021"

[dependencies]
clap = { version = "4.5.21", features = ["derive"] }
colog = "1.3.0"
colored = "2.1.0"
futures = "0.3.31"
futures-util = "0.3.31"
imara-diff = "0.1.7"
log = "0.4.22"
nucleo-matcher = "0.3.1"
rspotify = { version = "0.13.3", features = ["cli"] }
serde = "1.0.215"
tokio = { version = "1.40.1", features = ["macros", "rt", "rt-multi-thread"] }
tokio-macros = "2.4.0"

[dependencies.echo_db]
path = "../echo_db"
